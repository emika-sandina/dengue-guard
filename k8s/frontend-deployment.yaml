apiVersion: apps/v1
kind: Deployment
metadata:
  name: dengueguard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dengueguard-frontend
  template:
    metadata:
      labels:
        app: dengueguard-frontend
    spec:
      containers:
        - name: dengue-backend
          image: thimansa/dengueguard-frontend:latest
          
          volumeMounts:
          - name: frontend-config-volume
            mountPath: /usr/share/nginx/html/env.js
            subPath: env.js

      volumes:
        - name: frontend-config-volume
          configMap:
            name: frontend-config
          ports:
            - containerPort: 80