name: Deploy DengueGuard to GKE

on:
  push:
      branches:
        - main
        - deployment
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

            # SonarCloud scan
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=dengueguard
            -Dsonar.organization=senuthmi
            -Dsonar.sources=frontend,backend
            -Dsonar.branch.name=main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # OWASP Dependency Check
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "DengueGuard"
          path: "."
          format: "HTML"
          out: "reports"

      # Upload Dependency Check report
      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

      # Set Git SHA tag
      - name: Set image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Trivy container scan (use Git SHA tagged images)
      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: thimansa/dengueguard-backend:$IMAGE_TAG
          format: json
          
      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: thimansa/dengueguard-frontend:$IMAGE_TAG
          format: json


      # Docker Login
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # Build & Push Backend
      - name: Build & Push Backend
        run: |
          docker build -t thimansa/dengueguard-backend:$IMAGE_TAG ./backend
          docker push thimansa/dengueguard-backend:$IMAGE_TAG

      # Build & Push Frontend
      - name: Build & Push Frontend
        run: |
          docker build -t thimansa/dengueguard-frontend:$IMAGE_TAG ./frontend
          docker push thimansa/dengueguard-frontend:$IMAGE_TAG
      

      # Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE Auth Plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER }} \
          --zone ${{ secrets.GKE_ZONE }} \
          --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/